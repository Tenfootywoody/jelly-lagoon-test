/* Layout: one portrait screen with three views (home, map, game). Game = HUD strip, canvas playfield, crew power dock. Single lagoon look. */
:root{
  --night:#1b1247; --ink:#ffffff; --berry:#b23a7a; --gold:#ffe36b; --lime:#58c22e; --lime-d:#2c7a14;
  --panel:rgba(34,20,92,.84); --line:rgba(255,255,255,.3); --plum:#3a1a5c;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--night);color:var(--ink);font-family:var(--display);overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#bg{position:fixed;inset:0;background:var(--night) center/cover no-repeat}
#bg.soft{filter:blur(14px) brightness(.75);transform:scale(1.2)}
#bg::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(20,10,60,.3),rgba(20,10,60,.1) 40%,rgba(20,10,60,.4))}
#app{box-sizing:border-box;position:relative;z-index:1;height:100%;max-width:520px;margin:0 auto;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.view{height:100%;display:flex;flex-direction:column;gap:6px;min-height:0}
button{font-family:var(--display);color:var(--ink)}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* home */
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#fx.over{z-index:3}
#home{align-items:center;justify-content:center}
#homeArt{position:relative;flex:none;background:url(art/home.jpg) center/100% 100% no-repeat;border-radius:22px;box-shadow:0 10px 30px rgba(0,0,0,.45);font-size:16px}
#homeArt>*{position:absolute;margin:0}
#homeArt .btn{left:21%;top:79.5%;width:58%;height:8.4%;padding:0;font-size:1.9em;animation:breath 1.5s ease-in-out infinite}
#homeArt #sndHome{left:60.5%;top:90%;width:19%;height:5.2%;padding:0;font-size:.78em;border-radius:1em}
#homeArt .pill{top:90%;width:18.5%;height:5.2%;box-sizing:border-box;padding:.1em .3em;border-radius:1em}
#homeArt .pill small{font-size:.6em}#homeArt .pill b{font-size:1.25em}
#hpS{left:20.5%}#hpL{left:40.5%}
@keyframes floaty{50%{transform:translateY(-6px) rotate(-1deg)}}
@keyframes breath{50%{transform:scale(1.05)}}
@keyframes bob{50%{transform:translateY(-7px)}}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(.6)}50%{opacity:1;transform:scale(1.15)}}
@keyframes hopme{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,-12px)}}
#home h1{margin:0;font-size:clamp(44px,13vw,64px);font-weight:800;line-height:.95;text-shadow:0 4px 0 var(--berry),0 10px 22px rgba(0,0,0,.5);text-wrap:balance}
#home h1 span{display:block;color:var(--gold);font-size:1.25em;text-shadow:0 4px 0 #a86a00,0 10px 22px rgba(0,0,0,.5)}
#home p{margin:0;font-size:17px;font-weight:600;max-width:300px;text-shadow:0 2px 6px rgba(0,0,0,.7)}
.tag{display:inline-block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);font-weight:800}
.btn{display:block;width:100%;background:linear-gradient(#7be04a,var(--lime));color:#fff;font:800 22px var(--display);padding:10px 16px;border-radius:999px;border:3px solid #fff;box-shadow:0 5px 0 var(--lime-d);text-shadow:0 2px 0 var(--lime-d);cursor:pointer}
.btn.alt{background:linear-gradient(#6fb6ff,#3a82e0);box-shadow:0 5px 0 #1f4f9a;text-shadow:0 2px 0 #1f4f9a;font-size:18px}
#home .btn{max-width:280px}

/* map */
#mapTop{display:flex;gap:8px;align-items:center}
#mapTop .pill{flex:1}
.ib{flex:none;background:var(--panel);border:2px solid var(--line);border-radius:14px;font:800 14px/1.1 var(--display);padding:8px 12px;cursor:pointer}
#mapScroll{flex:1;min-height:0;overflow-y:auto;border-radius:18px;border:2px solid var(--line);-webkit-overflow-scrolling:touch}
.area{position:relative;background:center/cover no-repeat;content-visibility:auto;contain-intrinsic-size:auto 854px}
.area::before{content:"";position:absolute;inset:0;background:rgba(20,10,60,.12)}
.area h2{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);margin:0;white-space:nowrap;background:var(--panel);border:2px solid var(--gold);border-radius:999px;padding:2px 16px;font-size:16px;font-weight:800;z-index:2}
.node{position:absolute;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;border:3px solid #fff;background:radial-gradient(circle at 34% 26%,var(--n1,#ff9be0),var(--n2,#d936b0) 46%,var(--n3,#8f1d7a) 86%);border-color:#f6c94a;font:800 23px var(--display);text-shadow:0 2px 3px rgba(20,5,50,.8);box-shadow:inset 0 -6px 8px rgba(0,0,0,.18),0 5px 0 #c98f1f,0 10px 14px rgba(0,0,0,.4);cursor:pointer;z-index:2;font-variant-numeric:tabular-nums}
.node.lock{filter:saturate(.8) brightness(.86)}
.node.cur{background:radial-gradient(circle at 35% 30%,#b6f59a,#3da51e 70%);animation:pulse 1.2s ease-in-out infinite}

.node::before{content:"";position:absolute;left:17%;top:9%;width:30%;height:20%;border-radius:50%;background:rgba(255,255,255,.7);transform:rotate(-28deg);pointer-events:none}
.node i{position:absolute;left:50%;top:100%;transform:translateX(-50%);font:800 13px var(--display);font-style:normal;color:var(--gold);letter-spacing:1px;text-shadow:0 1px 2px #000;white-space:nowrap}
.node.resc::after{content:"";position:absolute;right:-6px;top:-6px;width:20px;height:20px;border-radius:50%;background:#fff;border:2px solid var(--gold);box-shadow:inset 0 0 0 4px #ff7ac0}
.node.boss{width:70px;height:70px;margin:-35px 0 0 -35px;font-size:24px}
.node img{position:absolute;left:-16px;top:-18px;width:38px;height:38px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.5));max-width:none}
.masc{position:absolute;width:60px;height:60px;margin:-30px 0 0 -30px;z-index:1;animation:bob 2.4s ease-in-out infinite;filter:drop-shadow(0 4px 3px rgba(0,0,0,.4))}
#pirate{position:fixed;left:0;top:0;z-index:3;height:auto;pointer-events:none;will-change:transform;filter:drop-shadow(0 6px 6px rgba(10,40,70,.25))}
.prop{position:absolute;width:104px;height:auto;z-index:1;pointer-events:none}
.np{position:absolute;width:66px;height:auto;z-index:1;pointer-events:none;filter:drop-shadow(0 4px 4px rgba(0,30,60,.35));animation:npf 3.2s ease-in-out infinite}.np.b{width:60px;animation-duration:3.8s}@keyframes npf{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-9px) rotate(3deg)}}@media (prefers-reduced-motion:reduce){.np{animation:none}}
.masc.anim{width:70px;height:70px;margin:-35px 0 0 -35px;animation:none}
.me{position:absolute;width:64px;height:64px;margin-top:-40px;z-index:3;animation:hopme .9s ease-in-out infinite;transform:translate(-50%,0);filter:drop-shadow(0 4px 3px rgba(0,0,0,.45));pointer-events:none}
.tw{position:absolute;width:10px;height:10px;z-index:1;background:#fff;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);animation:twinkle 2.2s ease-in-out infinite}
.dot{position:absolute;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:#fff6b8;box-shadow:0 0 10px 4px rgba(255,214,70,.95);z-index:1;animation:spark 1.6s ease-in-out infinite}
.dot.b{background:#e6fdff;box-shadow:0 0 9px 3px rgba(90,235,255,.95);width:7px;height:7px;margin:-3.5px 0 0 -3.5px}
@keyframes spark{0%,100%{opacity:.55;transform:scale(.7)}50%{opacity:1;transform:scale(1.15)}}
@keyframes pulse{50%{transform:scale(1.1)}}

/* game */
#hud{display:flex;gap:6px;align-items:stretch}
.pill{flex:1;min-width:0;background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:4px 8px;text-align:center;line-height:1.1}
.pill small{display:block;font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--gold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill b{font-size:21px;font-weight:800;font-variant-numeric:tabular-nums}
#strip{display:flex;justify-content:space-between;align-items:center;background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:0 12px;font-size:14px;font-weight:800;line-height:1.5}
#strip b{font-variant-numeric:tabular-nums;color:var(--gold)}
#sStars{color:var(--gold);letter-spacing:3px;font-size:17px}
#sStars i{font-style:normal;color:rgba(255,255,255,.28)}
#stage{flex:1;min-height:0;position:relative}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#say{position:absolute;left:8px;bottom:118px;max-width:62%;background:#fff;color:var(--plum);font-size:15px;font-weight:800;padding:6px 12px;border-radius:14px 14px 14px 4px;box-shadow:0 4px 10px rgba(0,0,0,.35);opacity:0;transform:translateY(6px);transition:opacity .2s,transform .2s;pointer-events:none}
#say.on{opacity:1;transform:none}
#dock{display:flex;gap:6px;justify-content:center;min-height:66px}
.pw{position:relative;flex:1;max-width:76px;min-width:0;background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:4px 2px 2px;font:800 11.5px/1.1 var(--display);cursor:pointer;text-align:center}
.pw canvas{width:40px;height:40px;display:block;margin:0 auto}
.pw em{position:absolute;right:2px;top:2px;min-width:20px;height:20px;border-radius:10px;background:var(--gold);color:#5a2a00;font:800 13px/20px var(--display);font-style:normal}
.pw[disabled]{opacity:.4}
.pw.lock{opacity:.55;font-size:10.5px}
.pw.lock canvas{filter:grayscale(1) brightness(.7)}
.pw.armed{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,227,107,.4)}

/* gold trim, from the owner's Meta painting of the play screen */
.pill,.ib,#strip,.pw{background:linear-gradient(#41309a,#231560);border-color:#e9c46a;box-shadow:inset 0 0 0 1px rgba(255,240,180,.25),inset 0 6px 10px rgba(255,255,255,.1),0 0 8px rgba(233,196,106,.45),0 3px 0 rgba(20,8,50,.7)}
.pill b,#btnPause{color:var(--gold);text-shadow:0 2px 0 #7a4a00,0 0 8px rgba(255,227,107,.5)}
.pw.lock{border-color:rgba(233,196,106,.55)}
.pw.armed{border-color:#fff;box-shadow:0 0 0 3px rgba(255,227,107,.7),0 0 14px rgba(255,227,107,.8)}
/* sheets */
#sheet{position:absolute;inset:0;z-index:5;border-radius:18px;display:flex;align-items:center;justify-content:center;background:rgba(15,8,50,.62);padding:12px}

.card.xmas{background:radial-gradient(120% 70% at 50% 0,#2fa866 0,#17804a 45%,#0d5a36 100%);border-color:#f6c648;box-shadow:0 0 0 4px #b3202e,0 14px 40px rgba(0,0,0,.5);padding-top:36px}
.card.xmas::before{content:"";position:absolute;left:10px;right:10px;top:4px;height:26px;pointer-events:none;
 background:linear-gradient(#0a3d24,#0a3d24) 0 4px/100% 2px no-repeat,
 radial-gradient(circle at 11px 13px,#ff4b4b 0 5.5px,transparent 6.5px) 0 0/88px 26px repeat-x,
 radial-gradient(circle at 33px 15px,#ffd83d 0 5.5px,transparent 6.5px) 0 0/88px 26px repeat-x,
 radial-gradient(circle at 55px 13px,#4db8ff 0 5.5px,transparent 6.5px) 0 0/88px 26px repeat-x,
 radial-gradient(circle at 77px 15px,#ff7ad1 0 5.5px,transparent 6.5px) 0 0/88px 26px repeat-x;
 filter:drop-shadow(0 0 4px rgba(255,240,170,.9));animation:hollights 1.1s ease-in-out infinite alternate}
@keyframes hollights{from{opacity:.55}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.card.xmas::before{animation:none}}
.card{position:relative;width:min(340px,100%);background:linear-gradient(#3b2a9a,#22145c);border:3px solid #fff;border-radius:26px;padding:20px 18px;text-align:center;box-shadow:0 14px 40px rgba(0,0,0,.5);display:flex;flex-direction:column;gap:10px}
.card h1{margin:0;font-size:32px;font-weight:800;line-height:1.05;text-shadow:0 3px 0 var(--berry);text-wrap:balance}
.card p{margin:0;font-size:16px;font-weight:600;line-height:1.35}
.card canvas.big{width:110px;height:110px;margin:0 auto}
.card .x{position:absolute;right:-10px;top:-10px;width:40px;height:40px;border-radius:50%;border:3px solid #fff;background:#e0457b;font:800 20px/1 var(--display);cursor:pointer;box-shadow:0 4px 0 #8a1c46}
.card .sub{font-size:14px;color:var(--gold);font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.chips{display:flex;gap:3px;justify-content:center;flex-wrap:wrap}.chips .chip{flex:0 0 calc(14.28% - 3px)}.chips .chip span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:10px}
.chip{flex:1;min-width:0;max-width:52px;padding:3px 0 2px;letter-spacing:-.02em;background:rgba(255,255,255,.1);border:2px solid var(--line);border-radius:12px;cursor:pointer;font:800 9.5px/1.1 var(--display)}
.chip canvas{display:block;width:100%;aspect-ratio:1;pointer-events:none}.chip span{pointer-events:none;display:block}
.chip.on{border-color:var(--gold);background:rgba(255,227,107,.25);box-shadow:0 0 0 3px rgba(255,227,107,.35)}
.chip.lock{opacity:.5}.chip.lock canvas{filter:grayscale(1) brightness(.6)}
.card canvas.big{width:96px;height:96px}
.vol{display:block;text-align:left;font-size:15px;font-weight:800}
.vol span{display:flex;justify-content:space-between}.vol b{color:var(--gold);font-variant-numeric:tabular-nums}
.vol input{display:block;width:100%;height:34px;margin:0;accent-color:#ffe36b;touch-action:pan-y}
.btn.ad{background:linear-gradient(#ffd75e,#f0a51e);box-shadow:0 5px 0 #a86a00;text-shadow:0 2px 0 #a86a00;font-size:19px}
.gold{color:var(--gold)}
.tier{align-self:center;font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:2px 14px;border-radius:999px;border:2px solid #fff}
.tier.hard{background:#e0457b}.tier.boss{background:#7a1f3d;box-shadow:0 0 12px rgba(255,80,120,.7)}
.card.spike{border-color:#ff8ab0;box-shadow:0 0 0 3px rgba(224,69,123,.45),0 14px 40px rgba(0,0,0,.5)}
.tb{position:absolute;left:50%;top:-14px;transform:translateX(-50%);font:800 10.5px/1 var(--display);letter-spacing:.06em;padding:3px 7px;border-radius:999px;border:2px solid #fff;color:#fff;white-space:nowrap;z-index:3}
.tb.hard{background:#e0457b}.tb.boss{background:#7a1f3d}
.adbar{height:10px;border-radius:5px;background:rgba(255,255,255,.2);overflow:hidden}.adbar i{display:block;height:100%;width:0;background:var(--gold);animation:adfill 2s linear forwards}
@keyframes adfill{to{width:100%}}
/* seaplane that tows a banner across the map (same as the first game) */
#plane{position:fixed;left:0;z-index:4;display:flex;align-items:center;cursor:pointer;will-change:transform;-webkit-tap-highlight-color:transparent;filter:drop-shadow(0 8px 6px rgba(10,40,70,.28))}

#plane.rtl .pl{transform:scaleX(-1)}
#plane .rope{width:34px;height:2px;background:linear-gradient(90deg,#7a5a3a,#b48a5a);flex:none;margin-top:10px}
#plane .ban{flex:none;max-width:62vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:12px;padding:6px 14px 7px;background:linear-gradient(180deg,#fffaf0,#ffe9c2);border:2px solid #fff;border-radius:6px;box-shadow:0 0 0 2px #e0602a,inset 0 -3px 0 rgba(160,80,20,.18);font-weight:800;font-size:clamp(13px,3.6vw,16px);color:#7a2e10;transform-origin:right center;animation:plwave 1.1s ease-in-out infinite alternate}

.deco{position:absolute;pointer-events:none}
.turtle{left:-70px;animation:swim 34s linear infinite;z-index:1}
.turtle span{display:block;animation:paddle 1.6s ease-in-out infinite alternate}
.turtle.rev{animation-name:swimr}.turtle.rev span{transform:scaleX(-1);animation-name:paddler}
@keyframes swim{from{left:-70px}to{left:calc(100% + 70px)}}
@keyframes swimr{from{left:calc(100% + 70px)}to{left:-70px}}
@keyframes paddle{from{transform:translateY(-4px) rotate(-5deg)}to{transform:translateY(4px) rotate(5deg)}}
@keyframes paddler{from{transform:scaleX(-1) translateY(-4px) rotate(-5deg)}to{transform:scaleX(-1) translateY(4px) rotate(5deg)}}
.dolphin{z-index:1;animation:leap 4.6s ease-in-out infinite;transform-origin:50% 60%}

.ring{width:34px;height:12px;border-radius:50%;border:3px solid #fff;opacity:0;z-index:1;animation:ring 4.6s ease-out infinite}
.ring.b{animation-name:ringb}
@keyframes ring{0%,38%,100%{opacity:0;transform:scale(.3)}42%{opacity:.9;transform:scale(.5)}58%{opacity:0;transform:scale(1.6)}}

/* water splash where a jelly lands */
.spl{position:absolute;width:50px;height:15px;margin:-7px 0 0 -25px;border-radius:50%;border:3px solid rgba(255,255,255,.95);background:rgba(200,244,255,.4);opacity:0;z-index:1;pointer-events:none;animation:spl .9s ease-out infinite}
.spl::before,.spl::after{content:"";position:absolute;bottom:70%;left:10%;width:7px;height:9px;border-radius:50% 50% 50% 50%/65% 65% 35% 35%;background:#e6f9ff;box-shadow:0 0 0 1.5px rgba(120,210,240,.8);--dx:-9px;animation:spd .9s ease-out infinite}
.spl::after{left:auto;right:10%;--dx:9px}
.spl.s3,.spl.s3::before,.spl.s3::after{animation-duration:2.7s}.spl.s3{animation-name:spl3}.spl.s3::before,.spl.s3::after{animation-name:spd3}

@keyframes spd3{0%{opacity:1;transform:translate(0,4px)}12%{opacity:1;transform:translate(var(--dx),-15px)}22%,100%{opacity:0;transform:translate(calc(var(--dx)*1.7),4px)}}

.cch{display:flex;justify-content:space-between;align-items:center;gap:.4em}.cch strong{font:800 1.75em/1 var(--display);text-shadow:0 .1em 0 rgba(0,0,0,.35);white-space:nowrap}
.cch strong.lg{font-size:1.25em}.cch span{flex:none;font:800 .72em/1 var(--display);letter-spacing:.07em;text-transform:uppercase;background:rgba(0,0,0,.38);border:.1em solid rgba(255,255,255,.6);border-radius:99em;padding:.38em .7em}
.cca{position:relative;flex:1;min-height:0;border-radius:.8em;border:.18em solid #fff3b0;background:radial-gradient(circle at 50% 42%,rgba(255,255,255,.95),rgba(255,255,255,.25) 55%,rgba(0,0,0,.18));display:flex;align-items:center;justify-content:center;overflow:hidden}

.cca i{position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.55) 48%,transparent 60%);transform:translateX(-120%);animation:ccsheen 3.2s ease-in-out infinite}
@keyframes ccsheen{0%,55%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
.ccp{background:rgba(20,10,60,.55);border-radius:.7em;padding:.5em .65em}.ccp b{display:block;font:800 1.08em/1.1 var(--display);color:#ffe36b}.ccp p{margin:.2em 0 0;font-size:.8em;font-weight:600;line-height:1.25}
.ccs{display:flex;gap:.35em}.ccs span{flex:1;background:rgba(255,255,255,.2);border-radius:.55em;padding:.3em .2em;font:800 .68em/1.15 var(--display);text-align:center}
.ccf{display:flex;justify-content:space-between;align-items:center;font:800 .66em/1 var(--display);opacity:.95}.ccf em{font-style:normal;color:#ffe36b;font-size:1.5em;letter-spacing:.05em;text-shadow:0 .08em 0 rgba(0,0,0,.4)}

/* lagoon-to-lagoon movie (plays once per lagoon, skippable) */
#trans{position:absolute;inset:0;z-index:9;border-radius:18px;overflow:hidden;background:#140a3c;color:#fff;text-align:center}
#trans .tb1,#trans .tb2{position:absolute;inset:0;background:center/cover no-repeat}
#trans .tb1{animation:trzoom 6.4s linear both}#trans .tb2{animation:trin 6.4s ease-in-out both}
#trans .shade{position:absolute;inset:0;background:radial-gradient(circle at 50% 42%,rgba(20,10,60,.15),rgba(20,10,60,.72))}
@keyframes trzoom{from{transform:scale(1)}to{transform:scale(1.18)}}
@keyframes trin{0%,40%{transform:translateY(-100%)}52%,100%{transform:translateY(0)}}
#trans .t1,#trans .t2{position:absolute;left:0;right:0;top:20%;padding:0 18px}
#trans .t1{animation:trt1 6.4s ease both}#trans .t2{animation:trt2 6.4s ease both}
@keyframes trt1{0%{opacity:0;transform:scale(.4)}7%{opacity:1;transform:scale(1.08)}11%,36%{opacity:1;transform:scale(1)}42%,100%{opacity:0;transform:translateY(40px)}}
@keyframes trt2{0%,52%{opacity:0;transform:translateY(-30px)}60%,100%{opacity:1;transform:none}}
#trans small{display:block;font:800 15px var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--gold);text-shadow:0 2px 4px rgba(0,0,0,.6)}
#trans h1{margin:4px 0;font:800 42px/1.02 var(--display);text-shadow:0 4px 0 var(--berry),0 10px 24px rgba(0,0,0,.6);text-wrap:balance}
#trans p{margin:6px 0 0;font:800 19px var(--display);text-shadow:0 2px 5px rgba(0,0,0,.7)}
#trans .stars{font-size:40px;color:var(--gold);letter-spacing:6px;text-shadow:0 3px 0 #a86a00}
#trans .hero{position:absolute;left:50%;bottom:17%;width:150px;margin-left:-75px;animation:trhero 6.4s ease-in-out both;filter:drop-shadow(0 8px 6px rgba(0,0,0,.45))}
@keyframes trhero{0%{transform:translateY(60vh)}9%{transform:translateY(-30px)}13%,36%{transform:translateY(0)}45%{transform:translate(-90vw,-40px) rotate(-14deg)}46%{transform:translate(90vw,-40px) rotate(14deg)}58%,100%{transform:none}}
#trans .cf{position:absolute;top:-20px;width:10px;height:16px;border-radius:3px;animation:trcf 2.6s linear both}
@keyframes trcf{to{transform:translateY(105vh) rotate(720deg)}}
#trans .skip{position:absolute;right:12px;top:12px;z-index:2;background:rgba(20,10,60,.75);border:2px solid #fff;border-radius:99px;color:#fff;font:800 16px var(--display);padding:7px 16px;cursor:pointer}
#trans .go{position:absolute;left:0;right:0;margin:0 auto;bottom:5%;width:min(280px,80%);animation:trt2 6.4s ease both;z-index:2}

.btn.alt,.btn.gold,.btn.ad{background:none!important;border:0!important;box-shadow:none!important;border-radius:0!important;border-image:var(--pb-blue) 50% 26% fill / 50% 1.3em stretch!important;filter:drop-shadow(0 4px 3px rgba(20,0,50,.4));padding:12px 18px 14px!important}
.btn.alt{text-shadow:0 2px 0 #1f4f9a,0 0 4px #1f4f9a}
.btn.gold,.btn.ad{border-image-source:var(--pb-yellow)!important;color:#5a2a00!important;text-shadow:0 1px 0 rgba(255,255,255,.6)!important}
.btn.alt:active,.btn.gold:active,.btn.ad:active,#hud .pill:active,#btnPause:active{transform:scale(.96)}
.hb.hot{border-color:#fff3b0}.hb.hot::after{content:"";position:absolute;right:-3px;top:-4px;width:12px;height:12px;border-radius:50%;background:#ff4d6d;border:2px solid #fff}
.card.tall{gap:8px;max-height:96%;overflow-y:auto;padding:16px 14px}.card.tall h1{font-size:26px}
.card .list{display:flex;flex-direction:column;gap:6px}
.bar{flex:none;height:12px;border-radius:6px;background:rgba(255,255,255,.2);overflow:hidden}.bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(#ffe98a,#f0a51e);transition:width .3s}
.grid7{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.gd{background:rgba(255,255,255,.08);border:2px solid var(--line);border-radius:12px;padding:5px 2px;line-height:1.15}
.gd small{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;opacity:.85}.gd b{font-size:14px}.gd.on{border-color:var(--gold);background:rgba(255,227,107,.22)}.gd.got{opacity:.45}.gd:last-child{grid-column:span 2}
.pt{display:flex;gap:5px;align-items:stretch}.pt em{flex:none;width:24px;align-self:center;font:800 16px var(--display);font-style:normal;color:var(--gold)}
.pt button{flex:1;min-width:0;background:rgba(255,255,255,.1);border:2px solid var(--line);border-radius:12px;padding:4px 3px;font:800 13px/1.15 var(--display);color:#fff;cursor:pointer}
.pt button small{display:block;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;opacity:.8}.pt button.g{background:rgba(255,227,107,.16);border-color:rgba(255,227,107,.6)}
.pt button:not(:disabled){border-color:#fff;box-shadow:0 0 0 2px rgba(255,227,107,.6)}.pt button:disabled{opacity:.6;cursor:default}.pt.off{opacity:.55}

function isTall(n){return n>=35&&n%5===0;}
function scrollT(){if(!S.tall)return 0;var low=0;S.grid.forEach(function(v,k){if((k>>4)>low)low=k>>4;});return Math.max(0,low-8);}

/* ---------- shot physics (pure) ---------- */
function trace(ang){
  var off0=S.off||0,yTop=TOP+R-off0*RH,x=SX,y=SY,dx=Math.cos(ang),dy=-Math.sin(ang),pts=[{x:x,y:y}],lo=X0+R,hi=X0+9*D-R,step=5,hit=false,cells=[];
  S.grid.forEach(function(v,k){cells.push(cxy(k>>4,k&15));});
  var lim=D*0.86,lim2=lim*lim,wh=S.whirl?whirlXY():null;
  for(var i=0;i<3000&&!hit;i++){
    x+=dx*step;y+=dy*step;
    if(wh){var wx=x-wh.x,wy=y-wh.y;if(wx*wx+wy*wy<wh.r*wh.r){var ca=Math.cos(wh.k),sa=Math.sin(wh.k),ndx=dx*ca-dy*sa,ndy=dx*sa+dy*ca;if(ndy<-0.15){dx=ndx;dy=ndy;}if(i%2===0)pts.push({x:x,y:y});}}
    if(x<lo){x=lo+(lo-x);dx=-dx;pts.push({x:lo,y:y});}
    else if(x>hi){x=hi-(x-hi);dx=-dx;pts.push({x:hi,y:y});}
    if(y<=yTop){y=yTop;break;}
    for(var j=0;j<cells.length;j++){var ex=cells[j].x-x,ey=cells[j].y-y;if(ex*ex+ey*ey<lim2){hit=true;break;}}
  }
  pts.push({x:x,y:y});
  var best=null,bd=1e9,r0=Math.max(0,Math.round((y-TOP-R)/RH+off0)-2);
  for(var r=r0;r<=r0+4&&r<=MAXR+1+Math.ceil(off0);r++)for(var c=0;c<cols(r);c++){
    if(S.grid.has(key(r,c)))continue;
    if(r>0&&!nbrs(r,c).some(function(p){return S.grid.has(key(p[0],p[1]));}))continue;
    var q=cxy(r,c),d2=(q.x-x)*(q.x-x)+(q.y-y)*(q.y-y);if(d2<bd){bd=d2;best={r:r,c:c};}
  }
  if(best){var e=cxy(best.r,best.c);pts[pts.length-1]={x:e.x,y:e.y};}
  return {pts:pts,cell:best};
}
function whirlXY(){return {x:X0+D*S.whirl.fx,y:TOP+R+S.whirl.row*RH,r:D*1.5,k:S.whirl.dir*0.036};}
function ringOf(r,c){var o=r%2?[[0,-1],[-1,0],[-1,1],[0,1],[1,1],[1,0]]:[[0,-1],[-1,-1],[-1,0],[0,1],[1,0],[1,-1]];return o.map(function(p){return [r+p[0],c+p[1]];});}
function group(r,c,col){var seen={},st=[[r,c]],out=[];seen[key(r,c)]=1;
  while(st.length){var p=st.pop();out.push(p);var n=nbrs(p[0],p[1]);
    for(var i=0;i<n.length;i++){var k=key(n[i][0],n[i][1]);if(!seen[k]&&S.grid.get(k)===col){seen[k]=1;st.push(n[i]);}}}
  return out;}
function floaters(){var seen=reach(S.grid),out=[];S.grid.forEach(function(v,k){if(!seen[k])out.push([k>>4,k&15,v]);});return out;}
/* place a shot; mutates the grid and returns what happened */
function place(cell,kind,pts){
  var pop=[],conv=[],trail=null,band=null,r=cell.r,c=cell.c,col=kind,o=cxy(r,c);
  if(kind===BOMB){S.grid.forEach(function(v,k){var p=cxy(k>>4,k&15);if(Math.hypot(p.x-o.x,p.y-o.y)<D*1.75)pop.push([k>>4,k&15,v]);});pop.push([r,c,BOMB]);}
  else if(kind===MANGO){S.grid.forEach(function(v,k){if((k>>4)===r||(k>>4)===r-1)pop.push([k>>4,k&15,v]);});pop.push([r,c,MANGO]);}
  else if(kind>=SUP){var m=kind-SUP,all=[];S.grid.forEach(function(v,k){all.push([k>>4,k&15,v]);});
    if(m===0){var a0=pts&&pts.length>1?pts[pts.length-2]:{x:SX,y:SY},ux=o.x-a0.x,uy=o.y-a0.y,ul=Math.hypot(ux,uy)||1;ux/=ul;uy/=ul;if(uy>-0.2){ux=0;uy=-1;}trail=[{x:o.x,y:o.y},{x:o.x+ux*H,y:o.y+uy*H}];
      all.forEach(function(p){var q=cxy(p[0],p[1]),t2=(q.x-o.x)*ux+(q.y-o.y)*uy;if(t2>-D*0.6&&Math.abs((q.x-o.x)*uy-(q.y-o.y)*ux)<D*0.8)pop.push(p);});}
    if(m===1)all.forEach(function(p){var q=cxy(p[0],p[1]);if(Math.hypot(q.x-o.x,q.y-o.y)<D*2.6)pop.push(p);});
    if(m===2){var cn={},wc=-1,wn=0;nbrs(r,c).forEach(function(q){var v=colOf(S.grid.get(key(q[0],q[1])));if(v>=0){cn[v]=(cn[v]||0)+1;if(cn[v]>wn){wn=cn[v];wc=v;}}});
      if(wc<0)wc=pickColor();all.forEach(function(p){if(colOf(p[2])===wc)pop.push(p);});}
    if(m===3){var low=0;all.forEach(function(p){if(p[0]>low)low=p[0];});all.forEach(function(p){if(p[0]>=low-1)pop.push(p);});band={y1:cxy(Math.max(0,low-1),0).y-R,y2:cxy(low,0).y+R};}
    if(m===4){var a4=pts&&pts.length>1?pts[pts.length-2]:{x:SX,y:SY},jx=o.x-a4.x,jy=o.y-a4.y,jl=Math.hypot(jx,jy)||1;jx/=jl;jy/=jl;if(Math.abs(jx)<0.35){jx=jx<0?-0.6:0.6;jy=-0.8;}
      trail=[{x:o.x,y:o.y}];var px=o.x,py=o.y,hitK={},lo4=X0+R,hi4=X0+9*D-R,bot=TOP+R;all.forEach(function(p){if(p[0]*RH+TOP+R>bot)bot=p[0]*RH+TOP+R;});bot+=RH;
      for(var s4=0;s4<D*11/5;s4++){px+=jx*5;py+=jy*5;if(px<lo4||px>hi4){jx=-jx;px+=jx*10;}if(py<TOP+R||py>bot){jy=-jy;py+=jy*10;}if(s4%5===0)trail.push({x:px,y:py});
        all.forEach(function(p){var kk4=key(p[0],p[1]);if(hitK[kk4])return;var q=cxy(p[0],p[1]);if(Math.hypot(q.x-px,q.y-py)<D*0.62){hitK[kk4]=1;pop.push(p);}});}}
    if(m===6){var did=0,bb=null;all.forEach(function(p){if(p[2]===ROCK||p[2]===GOO){pop.push(p);did++;}else if(p[2]>=FROZ){S.grid.set(key(p[0],p[1]),p[2]-FROZ);conv.push([p[0],p[1],p[2]-FROZ]);did++;}else if(p[2]===BABY&&(!bb||p[0]>bb[0]))bb=p;});
      if(bb){pop.push(bb);did++;}if(!did)all.forEach(function(p){var q=cxy(p[0],p[1]);if(Math.hypot(q.x-o.x,q.y-o.y)<D*1.75)pop.push(p);});}
    if(m===7){all.forEach(function(p){var q=cxy(p[0],p[1]);if(p[0]===r||Math.abs(q.x-o.x)<D*0.62)pop.push(p);});}
    if(m===8){var nb=[],cc8={},w8=-1,n8=0;all.forEach(function(p){var q=cxy(p[0],p[1]);if(Math.hypot(q.x-o.x,q.y-o.y)<D*2.2&&colOf(p[2])>=0)nb.push(p);});
      nb.forEach(function(p){var v=colOf(p[2]);cc8[v]=(cc8[v]||0)+1;if(cc8[v]>n8){n8=cc8[v];w8=v;}});
      if(nb.length){nb.forEach(function(p){S.grid.set(key(p[0],p[1]),w8);conv.push([p[0],p[1],w8]);});var g8=group(nb[0][0],nb[0][1],w8),seen8={};
        g8.concat(nb).forEach(function(p){var kk=key(p[0],p[1]);if(!seen8[kk]){seen8[kk]=1;pop.push([p[0],p[1],w8]);}});}}
    if(m===9){all.forEach(function(p){var q=cxy(p[0],p[1]);if(Math.hypot(q.x-o.x,q.y-o.y)<D*3.3)pop.push(p);});}
    if(m===10){var pool=all.filter(function(p){return colOf(p[2])>=0||p[2]===ROCK;});for(var z=0;z<14&&pool.length;z++){var zi=Math.floor(Math.random()*pool.length);pop.push(pool[zi]);pool.splice(zi,1);}}
    if(m===11){all.forEach(function(p){var q=cxy(p[0],p[1]);if(Math.abs(q.x-o.x)<D*1.15)pop.push(p);});trail=[{x:o.x,y:H},{x:o.x,y:0}];}
    if(m===12){var gc=0;all.forEach(function(p){var q=cxy(p[0],p[1]);if(Math.hypot(q.x-o.x,q.y-o.y)<D*2.3){pop.push(p);gc++;}});S.coins+=gc*3;try{say("Sol: +"+(gc*3)+" coins!");}catch(e){}}
    pop.push([r,c,kind]);}
  else{
    var n=nbrs(r,c),i,v;
    if(kind===JINX){var cnt={},bc=-1,bn=0;for(i=0;i<n.length;i++){v=colOf(S.grid.get(key(n[i][0],n[i][1])));if(v>=0){cnt[v]=(cnt[v]||0)+1;if(cnt[v]>bn){bn=cnt[v];bc=v;}}}
      col=bc<0?pickColor():bc;for(i=0;i<n.length;i++){var kk=key(n[i][0],n[i][1]);v=S.grid.get(kk);if(v!==undefined&&colOf(v)>=0&&v!==col){S.grid.set(kk,col);conv.push([n[i][0],n[i][1],col]);}}}
    if(kind===RAIN){var bestC=-1,bestN=0;for(i=0;i<n.length;i++){v=S.grid.get(key(n[i][0],n[i][1]));if(v===undefined||v>6)continue;
        S.grid.set(key(r,c),v);var gs=group(r,c,v).length;S.grid.delete(key(r,c));if(gs>bestN){bestN=gs;bestC=v;}}
      col=bestC<0?pickColor():bestC;}
    S.grid.set(key(r,c),col);var g=group(r,c,col);if(g.length>=3)g.forEach(function(p){pop.push([p[0],p[1],col]);});
  }
  pop.forEach(function(p){S.grid.delete(key(p[0],p[1]));});
  var thaw=[];pop.forEach(function(p){nbrs(p[0],p[1]).forEach(function(q){var k=key(q[0],q[1]),v2=S.grid.get(k);if(v2>=FROZ){S.grid.set(k,v2-FROZ);thaw.push([q[0],q[1],v2-FROZ]);}});});
  var clean=[];pop.forEach(function(p){nbrs(p[0],p[1]).forEach(function(q){var k=key(q[0],q[1]),v2=S.grid.get(k);if(v2===GOO||v2===CHEST){S.grid.delete(k);clean.push([q[0],q[1],v2]);}});});
  for(var gi=0;gi<clean.length;gi++){if(clean[gi][2]!==GOO)continue;nbrs(clean[gi][0],clean[gi][1]).forEach(function(q){var k=key(q[0],q[1]);if(S.grid.get(k)===GOO){S.grid.delete(k);clean.push([q[0],q[1],GOO]);}});}
  if(!pop.length&&kind<7&&nbrs(r,c).some(function(q){return S.grid.get(key(q[0],q[1]))===GOO;})&&!nbrs(r,c).some(function(q){return S.grid.get(key(q[0],q[1]))===kind;})){S.grid.set(key(r,c),GOO);conv.push([r,c,GOO]);}
  var spin=[];S.grid.forEach(function(v,k){if(v!==HUB)return;var h=cxy(k>>4,k&15);if(Math.hypot(h.x-o.x,h.y-o.y)<D*2.1)spin.push(k);});
  spin.forEach(function(k){var rg=ringOf(k>>4,k&15),vals=rg.map(function(p){return S.grid.get(key(p[0],p[1]));});
    rg.forEach(function(p,i){var v=vals[(i+5)%6],kk=key(p[0],p[1]);if(v===undefined)S.grid.delete(kk);else S.grid.set(kk,v);});});
  var drop=(pop.length||spin.length)?floaters():[];drop.forEach(function(p){S.grid.delete(key(p[0],p[1]));});
  var saved=0,chests=0;pop.concat(drop,clean).forEach(function(p){if(p[2]===BABY)saved++;if(p[2]===CHEST)chests++;});
  return {pop:pop,drop:drop,thaw:thaw,conv:conv,saved:saved,col:col,trail:trail,band:band,spin:spin,clean:clean,chests:chests};
}

/* ---------- turn flow ---------- */
function fire(ang){
  if(S.state!=="play"||ball||S.shots<=0)return false;if(S.tall&&Math.abs(S.off-S.offT)>0.03)return false;
  var t=trace(ang);if(!t.cell)return false;
  var col=S.armed>=0?S.armed:S.sup?SUP+S.mate:S.cur;
  if(S.armed>=0)usePower(S.armed);else if(S.sup){S.sup=false;S.meter=0;}else{S.cur=S.next;S.next=pickColor(S.rnd);}
  S.armed=-1;S.shots--;if(S.long>0)S.long--;S.loadAt=performance.now();S.wheelA=(S.wheelA||0)+1.0472;
  var len=0;for(var i=1;i<t.pts.length;i++)len+=Math.hypot(t.pts[i].x-t.pts[i-1].x,t.pts[i].y-t.pts[i-1].y);
  ball={pts:t.pts,cell:t.cell,col:col,len:len,d:0};aim=null;snd("shoot");hud();return true;
}
function land(){
  var b=ball;ball=null;var res=place(b.cell,b.col,b.pts),n=res.pop.length,m=res.drop.length;
  res.conv.forEach(function(p){var q=cxy(p[0],p[1]);fx.push({t:"ring",x:q.x,y:q.y,a:0});});
  res.spin.forEach(function(k){var q=cxy(k>>4,k&15);fx.push({t:"spin",x:q.x,y:q.y,a:0});});if(res.spin.length){snd("stick");if(!n)say("The wheel turns!");}
  if(!n&&m){res.drop.forEach(function(p){var q=cxy(p[0],p[1]);fx.push({t:"fall",x:q.x,y:q.y,v:p[2],vx:(Math.random()-.5)*120,vy:-80-Math.random()*120,a:0});});S.score+=m*20;}
  res.thaw.forEach(function(p){var q=cxy(p[0],p[1]);fx.push({t:"ring",x:q.x,y:q.y,a:0,ice:1});});
  if(res.chests){S.shots+=3*res.chests;var qc=cxy(b.cell.r,b.cell.c);fx.push({t:"txt",x:qc.x,y:qc.y-D,s:"+"+(3*res.chests)+" shots",a:0});snd("win");}
  if(n){
    res.clean.forEach(function(p){var q=cxy(p[0],p[1]);fx.push({t:"pop",x:q.x,y:q.y,v:p[2],a:0});});
    res.pop.forEach(function(p,i){var q=cxy(p[0],p[1]);fx.push({t:"pop",x:q.x,y:q.y,v:p[2],a:-Math.min(i,12)*0.03});});
    res.drop.forEach(function(p){var q=cxy(p[0],p[1]);fx.push({t:"fall",x:q.x,y:q.y,v:p[2],vx:(Math.random()-.5)*120,vy:-80-Math.random()*120,a:0});});
    var pts=n*10+(n>3?(n-3)*10:0)+m*20+res.saved*100;S.score+=pts;S.saved+=res.saved;
    var q0=cxy(b.cell.r,b.cell.c);fx.push({t:"txt",x:q0.x,y:q0.y,s:"+"+pts,a:0});
    snd(b.col===BOMB||b.col>=SUP?"boom":"pop",n+m);
    if(b.col>=SUP){var q9=cxy(b.cell.r,b.cell.c);fx.push({t:"blast",x:q9.x,y:q9.y,a:0,c:TINT[MATES[S.mate].c]});if(res.trail)fx.push({t:"trail",p:res.trail,a:0,c:TINT[MATES[S.mate].c]});if(res.band)fx.push({t:"band",y1:res.band.y1,y2:res.band.y2,a:0});}
    else if(!S.sup){var gain=0;res.pop.concat(res.drop).forEach(function(p){gain+=colOf(p[2])===MATES[S.mate].c?2:1;});S.meter=Math.min(NEED,S.meter+gain);}cheer=n+m>=6?1.6:0.9;
    if(res.saved)say(pick(["A baby jelly is free!","You saved one!","Thank you, thank you!"]));
    else if(m>=6)say(pick(["Whoa, look at them fall!","Big drop!","That's how it's done!"]));
    else if(n>=6)say(pick(["Nice shot!","Pop pop pop!","Beautiful!"]));
    else if(res.thaw.length)say("The ice is cracking!");
    if(res.chests)say("Treasure! "+(3*res.chests)+" extra shots.");
  }else{snd("stick");if(S.grid.get(key(b.cell.r,b.cell.c))===GOO)say("Sludge's goo swallowed it!");}
  var fk,fz=0;for(fk in S.fizz){if(!(S.grid.get(+fk)<7))delete S.fizz[fk];else fz++;}
  S.turn++;if(fz&&S.turn%3===0&&S.grid.size){var fc=colorsOnBoard();if(fc.length>1){for(fk in S.fizz){var ov=S.grid.get(+fk),nv=ov;while(nv===ov)nv=fc[Math.floor(Math.random()*fc.length)];S.grid.set(+fk,nv);var fq=cxy(+fk>>4,+fk&15);fx.push({t:"ring",x:fq.x,y:fq.y,a:0});}if(!n)say("Fizz scrambled the colors!");}}
  var cs=colorsOnBoard();
  if(cs.length){if(cs.indexOf(S.cur)<0)S.cur=pickColor(S.rnd);if(cs.indexOf(S.next)<0)S.next=pickColor(S.rnd);}
  if(S.meter>=NEED&&!S.sup){var M=MATES[S.mate];
    if(S.mate===5){S.meter=0;S.shots+=5;cheer=1.6;snd("win");say("Mango: snack break! 5 more shots.");}
    else{S.sup=true;cheer=1.6;snd("win");say(M.name+": "+M.pow+" is ready!");}}
  hud();
  if(S.goal.type==="rescue"?S.saved>=S.goal.need:S.grid.size===0)return end(true);
  if(S.grid.size===0)return end(true);
  var low=0;S.grid.forEach(function(v,k){if((k>>4)>low)low=k>>4;});
  S.offT=scrollT();if(low-S.offT>=MAXR)return end(false,"The bubbles reached the bottom.");
  if(S.shots<=0)return end(false,"You ran out of shots.");
  if(S.shots===5)say("Only 5 shots left. Make them count!");
}
function end(win,why){
  S.state=win?"won":"lost";
  if(win){
    S.grid.forEach(function(v,k){var q=cxy(k>>4,k&15);fx.push({t:"fall",x:q.x,y:q.y,v:v,vx:(Math.random()-.5)*160,vy:-60-Math.random()*160,a:0});});S.grid.clear();
    var left=S.shots,stars=left>=S.limit*0.25?3:left>=S.limit*0.1?2:1;S.score+=left*50;
    if(S.daily){var fd=!dailyDone();S.dly={n:dayNum()};S.lastCoins=fd?50:5;S.coins+=S.lastCoins;if(fd)S.shells+=3;S.metaLine=fd?"Daily level done: +3 shells":"";S.sinceInter++;}
    else{var first=!S.firstWin[S.lvl];S.firstWin[S.lvl]=1;S.lastCoins=first?10+stars*5:5;S.coins+=S.lastCoins;S.sinceInter++;
    delete S.fails[S.lvl];if(!S.best[S.lvl]||S.best[S.lvl]<stars)S.best[S.lvl]=stars;if(S.lvl>=S.max&&S.lvl<LEVELS)S.max=S.lvl+1;metaWin(stars,first);}
    snd("win");hud();winQ={t:0,n:Math.min(left,12),k:0,stars:stars};
  }else{if(!S.daily)S.fails[S.lvl]=(S.fails[S.lvl]||0)+1;S.streakWas=S.streak;S.streak=0;S.outShots=S.shots<=0;S.sinceInter++;S.lostLife=S.lvl>NOLIFE&&!S.daily;loseLife();snd("lose");setTimeout(function(){sheet("lose",why);},500);}
  save();
}

function easter(y){var a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=(h+l-7*m+114)%31+1;return new Date(y,mo-1,da);}

function holNow(){var now=new Date(),t=new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime();for(var i=0;i<HOLS.length;i++)for(var y=now.getFullYear();y<=now.getFullYear()+1;y++){var d=holDay(HOLS[i][0],y).getTime(),left=Math.round((d-t)/864e5);if(left>=0&&left<14)return {k:HOLS[i][0],left:left};}return null;}
function holWhen(k){if(k==="xmas")return "Dec 18 to Dec 27";if(k==="newyear")return "Dec 28 to Jan 2";var now=NOW(),d=holDay(k,now.getFullYear());if(d<new Date(now.getFullYear(),now.getMonth(),now.getDate()))d=holDay(k,now.getFullYear()+1);var s=new Date(d.getTime()-13*864e5),M=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];return M[s.getMonth()]+" "+s.getDate()+" to "+M[d.getMonth()]+" "+d.getDate();}
/* ---- holiday pearl hunt: a dated event that hands out that holiday's collector cards ----
   Christmas runs Dec 18 to Dec 27, New Year's Dec 28 to Jan 2 (owner's dates); every other holiday uses its 14 days. */
function NOW(){return (!CFG.live&&window.__popNow)?new Date(window.__popNow):new Date();}
function hev(){var n=NOW(),y=n.getFullYear(),m=n.getMonth(),d=n.getDate(),t=new Date(y,m,d).getTime(),e=null;
  if(m===11&&d>=18&&d<=27)e={k:"xmas",y:y,left:27-d};
  else if(m===11&&d>=28)e={k:"newyear",y:y+1,left:(31-d)+2};
  else if(m===0&&d<=2)e={k:"newyear",y:y,left:2-d};
  else{for(var i=0;i<HOLS.length&&!e;i++){var k=HOLS[i][0];if(k==="xmas"||k==="newyear")continue;for(var yy=y;yy<=y+1;yy++){if(k==="thanks"&&yy<2027)continue;var left=Math.round((holDay(k,yy).getTime()-t)/864e5);if(left>=0&&left<14){e={k:k,y:yy,left:left};break;}}}}
  if(!e)return null;
  for(var j=0;j<HOLS.length;j++)if(HOLS[j][0]===e.k)e.cards=HOLS[j][1];
  e.need=e.cards.length>=4?[30,75,120,180]:e.cards.length===3?[30,75,120]:[30,75];e.name=e.k==="xmas"?"Holiday Pearl Hunt":CTYPE[e.k][0]+" Pearl Hunt";
  if(!S.hv||S.hv.k!==e.k||S.hv.y!==e.y)S.hv={k:e.k,y:e.y,p:0};
  e.p=S.hv.p;return e;}
function hevAdd(n){var e=hev();if(!e)return 0;S.hv.p+=n;e.cards.forEach(function(c,i){if(S.hv.p>=e.need[i])S.hc["H"+c[1]]=1;});return n;}
function hevNext(e){for(var i=0;i<e.cards.length;i++)if(e.p<e.need[i])return i;return -1;}
function holCard(){var e=hev();if(!e){card('<h1>No holiday event right now</h1><p>The next one starts soon. Holiday cards you already won stay in your collection.</p>'+CLOSE);return;}
  var nx=hevNext(e),top=e.need[e.need.length-1],h='<span class="tag">Holiday event · '+(e.left===0?"last day":days(e.left)+" left")+'</span>'+(e.k==="xmas"?'<h1 class="hollogo" role="img" aria-label="Holiday Pearl Hunt"></h1>':'<h1>'+e.name+'</h1>')+'<p>Every star you win is 1 pearl. Pearls unlock '+(e.cards.length===2?"both":"all "+e.cards.length)+' holiday collector cards. They are yours to keep. <b class="gold">'+e.p+(e.p===1?" pearl":" pearls")+'</b> so far.</p><div class="bar"><i style="width:'+Math.min(100,Math.round(e.p/top*100))+'%"></i></div>';
  e.cards.forEach(function(c,i){var got=e.p>=e.need[i];h+='<div class="row"><div><strong>'+c[0]+'</strong><span>'+(got?"Card collected":e.need[i]+" pearls"+(i===nx?" · "+(e.need[i]-e.p)+" to go":""))+'</span></div><button class="btn '+(got?"gold":"alt")+'" data-a="'+(got?"cardview":"closecard")+'" data-i="'+CIDX["H"+c[1]]+'" type="button">'+(got?"See card":"Locked")+'</button></div>';});
  card(h+CLOSE,e.k==="xmas"?"xmas":"");}
function cardOwned(i){var c=CARDS[i];if(c.k==="lag")return !!S.firstWin[c.lv||(i+1)*10];if(c.k==="star")return !!S.firstWin[c.lv];if(c.k==="hol")return !!S.hc[c.id];
  for(var j=0;j<c.m.length;j++)if(!cardOwned(CIDX[c.m[j]]))return false;return true;}
function cardCount(){var n=0;for(var i=0;i<CARDS.length;i++)if(cardOwned(i))n++;return n;}
function cardNew(){var q=[];for(var i=0;i<CARDS.length;i++)if(cardOwned(i)&&S.cseen.indexOf(CARDS[i].id)<0){S.cseen.push(CARDS[i].id);q.push(i);}return q;}
function cardHTML(i,cls){var c=CARDS[i],ty=CTYPE[c.t],col=c.c||[ty[1],ty[2]],st="",art;for(var s=0;s<5;s++)st+=s<c.r?"★":"";
  if(c.grp)art='<div class="cca grp g'+c.m.length+'">'+c.m.map(function(id){var m=CARDS[CIDX[id]];return '<img alt="" src="'+(typeof m.img==="function"?(m.imgURL||(m.imgURL=m.img())):m.img)+'">';}).join("")+'<i></i></div>';
  else art='<div class="cca"><img alt="" src="'+(typeof c.img==="function"?(c.imgURL||(c.imgURL=c.img())):c.img)+'"><i></i></div>';
  var fr=c.grp||c.t==="legend"?"fgold":c.t==="power"?"fpur":c.t==="sour"?"fmoss":c.t==="friend"?"fblue":"fgum";
  return '<div class="cc '+fr+' '+(cls||"")+'" style="--c1:'+col[0]+';--c2:'+col[1]+'"><div class="cci"><div class="cch"><strong'+(c.n.length>10?' class="lg"':'')+'>'+c.n+'</strong><span>'+(c.grp?"Crew card":ty[0])+'</span></div>'+art+
    '<div class="ccp"><b>'+c.pow+'</b><p>'+c.what+'</p></div><div class="ccs"><span>'+c.a+'</span><span>'+c.b+'</span></div><div class="ccf"><em>'+st+'</em><span>No. '+(i<9?"0":"")+(i+1)+' / '+CARDS.length+(c.k==="lag"?' · '+AREAS[c.lv?c.lv/10-1:i]:"")+'</span></div></div></div>';}
function cardTile(i,hint){return cardOwned(i)?'<button type="button" class="ccb" data-a="cardview" data-i="'+i+'" aria-label="'+CARDS[i].n+'">'+cardHTML(i,"mini")+'</button>':'<div class="ccb lock"><b>?</b><small>'+hint+'</small></div>';}
function cardsCard(t){t=t||cardsCard.t||"reg";cardsCard.t=t;
  var REG=[],HOL=[],SPE=[];for(var q=0;q<CARDS.length;q++){var cq=CARDS[q];if(cq.k==="hol"||(cq.grp&&CTYPE[cq.t]&&HOLS.some(function(g){return g[0]===cq.t;})))HOL.push(q);else if(cq.k==="spe")SPE.push(q);else REG.push(q);}
  function own(a){var n=0;a.forEach(function(i){if(cardOwned(i))n++;});return n;}
  var tabs=[["reg","Lagoon",REG],["spe","Special Events",SPE],["hol","Holiday",HOL]];
  var h='<span class="tag">Card library</span><h1>'+cardCount()+' of '+CARDS.length+' cards</h1><div class="ctabs">'+tabs.map(function(x){return '<button class="ctab'+(x[0]===t?" on":"")+'" data-a="ctab" data-t="'+x[0]+'" type="button">'+x[1]+'<small>'+own(x[2])+'/'+x[2].length+'</small></button>';}).join("")+'</div>';
  h+='<p class="note">'+(t==="reg"?"Beat the last level of a lagoon to win one card. Themed crews join as you go.":t==="hol"?"Won only during holiday events. Once an event ends, its cards stay in your library.":"Cards from special events during the year. Watch for the next one.")+' Tap a card you own to look at it.</p>';
  function sec(title,how,ids,hintf){var n=0;ids.forEach(function(i){if(cardOwned(i))n++;});h+='<div class="set"><div class="sh"><strong>'+title+' '+n+'/'+ids.length+'</strong><span>'+how+'</span></div><div class="ccg">'+ids.map(function(i,j){return cardTile(i,hintf(i,j));}).join("")+'</div></div>';}
  if(t==="reg"){var lag=[];for(var i=0;i<20;i++)lag.push(i);
  sec("Lagoon cards","Beat a lagoon's last level",lag,function(i){return "Level "+((i+1)*10);});
  var cou=[];for(var q=0;q<CARDS.length;q++)if(CARDS[q].t==="cousins")cou.push(q);sec("Jelly Cousins","Lagoons 21 to 50",cou,function(i){return "Level "+CARDS[i].lv;});
  CREWS.forEach(function(g){var ids=g[1].map(function(m){return CIDX["C"+m[1]];});ids.push(CIDX["G"+g[0]]);sec(CTYPE[g[0]][0],"Arrives at level "+(CBASE[g[0]]*10),ids,function(i){return CARDS[i].grp?"All 4":"Level "+CARDS[i].lv;});});
  sec("Crew cards","Collect every member",[CIDX.Gcrew,CIDX.Gsour],function(){return "All members";});}
  function hend(k){var n=NOW(),y=n.getFullYear(),t0=new Date(y,n.getMonth(),n.getDate()).getTime(),d=k==="xmas"?new Date(y,11,27):k==="newyear"?new Date(y+(n.getMonth()===0&&n.getDate()<=2?0:1),0,2):holDay(k,y);if(d.getTime()<t0)d=k==="xmas"?new Date(y+1,11,27):holDay(k,y+1);return d.getTime()-t0;}
  if(t==="hol")HOLS.slice().sort(function(a,b){return hend(a[0])-hend(b[0]);}).forEach(function(g){var ids=g[1].map(function(m){return CIDX["H"+m[1]];});ids.push(CIDX["G"+g[0]]);sec(CTYPE[g[0]][0],"Holiday event · "+holWhen(g[0]),ids,function(i){return CARDS[i].grp?"All "+g[1].length:"Holiday event";});});
  if(t==="spe"){if(SPE.length)sec("Special events","Special event",SPE,function(){return "Special event";});else h+='<div class="set cempty"><strong>No special events yet</strong><span>Special events pop up during the year for things like a lunar eclipse. Their cards will be kept here.</span></div>';}
  card(h+CLOSE,"tall cardsv");var sv=$("sheet").querySelector(".card");if(sv)sv.scrollTop=0;}
ACT.ctab=function(b){cardsCard(b.getAttribute("data-t"));};
ACT.cardview=function(b){var i=+b.getAttribute("data-i");card('<span class="tag">Collector card</span>'+cardHTML(i)+'<button class="btn alt" data-a="cardsback" type="button">Back to my cards</button>',"tall");};
ACT.cardsback=function(){cardsCard(cardsCard.t);};
ACT.cardnew=function(){var q=S.newCards||[],i=q.shift();if(i==null){sheet("win",S.winStars||1);return;}card('<span class="tag">New collector card'+(q.length?" · "+q.length+" more":"")+'</span><h1>You won a card!</h1>'+cardHTML(i,"pop")+'<button class="btn gold" data-a="cardnew" type="button">'+(q.length?"Next card":"Keep it")+'</button>',"tall");snd("win");};
HUBS.cards=cardsCard;HUBS.hol=holCard;
if(S.cv!==2){S.cv=2;S.hc={};S.cseen=null;}
if(!S.cseen){S.cseen=[];for(var ci0=0;ci0<CARDS.length;ci0++)if(cardOwned(ci0))S.cseen.push(CARDS[ci0].id);}
/* ---- the little movie between lagoons ---- */

  for(var i=0;i<26;i++)cf+='<i class="cf" style="left:'+(i*3.9+1)+'%;background:'+cols[i%6]+';animation-delay:'+((i*37)%13)/10+'s"></i>';
  el.innerHTML='<div class="tb1" style="background-image:url(art/bg'+a%BGN+'.jpg)"></div><div class="tb2" style="background-image:url(art/bg'+(a+1)%BGN+'.jpg)"></div><div class="shade"></div>'+cf+
    '<div class="t1"><small>Congratulations!</small><h1>You beat '+AREAS[a]+'</h1><div class="stars">★★★</div><p>Lagoon '+(a+1)+' of '+AREAS.length+' saved</p></div>'+
    '<div class="t2"><small>Next up</small><h1>'+AREAS[a+1]+'</h1><p>Levels '+((a+1)*10+1)+' to '+((a+2)*10)+'</p></div>'+
    '<img class="hero" alt="" src="art/anim/ruby-muse.webp"><button class="skip" type="button">Skip</button><button class="btn go" type="button">Let\'s go!</button>';
  el.hidden=false;snd("win");var over=false;function end2(){if(over)return;over=true;clearTimeout(tm);el.hidden=true;el.innerHTML="";done();}
  var tm=setTimeout(end2,9000);el.querySelector(".skip").onclick=end2;el.querySelector(".go").onclick=end2;}
function goNext(n){var a=areaOf(n)-1;if(n===S.lvl+1&&S.lvl%10===0&&a>=0&&AREAS[a+1]&&!S.seen["tr"+a]){S.seen["tr"+a]=1;save();playTrans(a,function(){startLevel(n);});}else startLevel(n);}
try{Ads.init();}catch(e){}
requestAnimationFrame(loop);
if(!CFG.live)window.__pop={hev:hev,hevAdd:hevAdd,holCard:holCard,playTrans:playTrans,cardHTML:cardHTML,CARDS:CARDS,holNow:holNow,metaWin:metaWin,hub:hub,HUBS:HUBS,roll:roll,end:end,save:save,MATES:MATES,NEED:NEED,tier:tier,shop:shop,buy:buy,Ads:Ads,lives:livesCard,fly:flyPlane,row:rowPirate,scroll:scroll,isTall:isTall,S:S,trace:trace,place:place,fire:fire,gen:gen,build:buildLevel,start:startLevel,goMap:goMap,size:size,colors:colorsOnBoard,
  geo:function(){return {W:W,H:H,D:D,SX:SX,SY:SY,MAXR:MAXR};},C:{BOMB:BOMB,RAIN:RAIN,ROCK:ROCK,BABY:BABY,MANGO:MANGO,JINX:JINX,KIWI:KIWI,HUB:HUB,GOO:GOO,CHEST:CHEST,FROZ:FROZ}};
